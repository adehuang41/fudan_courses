experiment:
  name: ABC_mixed_act_baseline
  stage: baseline
  output_dir: /data/dechao/cv_final_pj2/outputs/baseline/ABC_mixed_act_baseline
dataset:
  split_name: ABC_mixed
  split_manifest: /data/dechao/cv_final_pj2/datasets/calvin_task_ABC_D/_download_logs/environment_episode_map.csv
  dataset_root: /data/dechao/cv_final_pj2/datasets/calvin_task_ABC_D
  image_keys:
    - observation.images.image
    - observation.images.wrist_image
  validation_fraction: 0.05
  mixing: concat_shuffle
train:
  steps: 50000
  batch_size: 16
  num_workers: 48
  validation_num_workers: 8
  seed: 20260531
  log_interval: 50
  checkpoint_interval: 5000
  validation_interval: 5000
  grad_clip_norm: 10.0
  device: cuda
  physical_gpu: 5
  amp: "off"
  prefetch_factor: 2
  persistent_workers: true
  validation_persistent_workers: false
logging:
  local_only: true
  wandb: false
  swanlab: false
